[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = [
    ".",
]
omit = [
    "env/*",
    "tests/*",
    "deprecated/*",
    "config_files/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
