inactivity_detector:
  heartbeat:
    collection: system_heartbeats
    timestamp_field: emitted_at
    status_field: status
    ok_value: alive
    interval_seconds: 10
    max_missed: 0

  # Optional log sources for context (no user inactivity intervals are stored).
  log_sources:
    # GitHub collections
    - name: github_pull_requests
      project_id: LD_Test
      source_type: mongo
      collection: github_LD_Test.pull_requests
      timestamp_field: created_at
      inactivity_threshold_minutes: 1440

    - name: github_issues
      project_id: LD_Test
      source_type: mongo
      collection: github_LD_Test.issues
      # created_at is nested under issue.*
      timestamp_field: issue.created_at
      inactivity_threshold_minutes: 1440

    - name: github_commits
      project_id: LD_Test
      source_type: mongo
      collection: github_LD_Test.commits
      timestamp_field: date
      inactivity_threshold_minutes: 1440

    # Taiga collections
    - name: taiga_issues
      project_id: LD_Test
      source_type: mongo
      collection: taiga_LD_Test.issues
      timestamp_field: created_date
      inactivity_threshold_minutes: 1440

    - name: taiga_tasks
      project_id: LD_Test
      source_type: mongo
      collection: taiga_LD_Test.tasks
      timestamp_field: created_date
      inactivity_threshold_minutes: 1440

    - name: taiga_userstories
      project_id: LD_Test
      source_type: mongo
      collection: taiga_LD_Test.userstories
      timestamp_field: created_date
      inactivity_threshold_minutes: 1440

    - name: taiga_epics
      project_id: LD_Test
      source_type: mongo
      collection: taiga_LD_Test.epics
      timestamp_field: created_date
      inactivity_threshold_minutes: 1440

  outputs:
    base_dir: artifacts/inactivity_detector
    events_dir: artifacts/inactivity_detector/events
    reports_dir: artifacts/inactivity_detector/runs
    enabled: false

  persistence:
    downtime_collection: inactivity_intervals
