services:
  ld_connect:
    build:
      context: .
      dockerfile: dockerfile
    container_name: LDConnect
    environment:
      - EVAL_HOST=ld_eval
      - EVAL_PORT=5001
    env_file:
      - .env
    networks:
      - qrapids
    depends_on:
    mongodb:
        condition: service_started
    ports:
      - "127.0.0.1:5000:5000"


networks:
  qrapids:
    external: true
